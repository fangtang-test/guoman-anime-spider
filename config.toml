# ============================================================================
#  国漫数据采集 · 配置文件
#  改完直接重跑即可，不需要改代码。
# ============================================================================

[http]
# 单次请求超时（秒）
timeout        = 25.0
# 失败重试次数（对 429 / 5xx / 连接错误生效）
retries        = 3
# 重试退避基数：第 n 次重试等待 backoff ** n 秒（再叠加随机抖动）
backoff        = 2.5
# 请求间隔（秒），每次请求前后随机取一个值 —— 这是防封最有效的一招
min_delay      = 1.2
max_delay      = 2.8
# 触发退避的 HTTP 状态码
retry_status   = [429, 500, 502, 503, 504]

# 代理。留空 = 直连（requests 仍会自动识别系统环境变量 HTTP_PROXY / HTTPS_PROXY）
# 例：proxies = { https = "http://127.0.0.1:7890" }
[proxies]
# https = "http://127.0.0.1:7890"

# ---------------------------------------------------------------------------
#  豆瓣（主数据源）
#  已验证：枚举接口与 rexxar 详情接口都不需要 Cookie / 登录
# ---------------------------------------------------------------------------
[douban]
enabled        = true
# 采集标签。多条会并集去重。
#
# 【重要】这里没有 movie / tv 分类开关，是故意的：
# 枚举接口的 type 参数实测被豆瓣完全忽略 —— 传 type=movie、type=tv、
# 或者根本不传，返回的都是同一批数据。更离谱的是老接口
# type=movie&tag=国产动画 返回的却是《眷思量 第二季》《仙逆 年番1》这类剧集，
# 说明豆瓣自己的 type 分类本身就不可信。
# 所以：电影还是剧集，一律由详情里的 is_tv 字段判定，不靠标签也不靠 type。
#
# 那标签干什么用？—— 决定「能捞到哪些作品」。实测覆盖情况：
#   "动画"      动画电影为主，条目量大（start=5000 之后还有）
#   "国产动画"  ★关键：首页全是电影，但 start=200 之后就是国漫番剧大本营
#               （镇魂街 / 一人之下 / 沧元图 / 斗破苍穹 / 一念永恒 /
#                 完美世界 / 星辰变 / 雪鹰领主 …抽样 10 条里 8 条是剧集）
#   "日本动画"  日番剧集 + 日影（能翻到 start=4000 之后）
#   "中国动画"  少量早期国产动画剧集（罗小黑战记 / 土豆侠 …）
#   "国漫"      极少量（个位数）
#   "欧美动画"  极少量（个位数）
#
# 下面这三个是**档期标签**，跟题材无关，但它们才是「能让猫眼票房对上号」的关键：
#   "中国大陆"  ★实测一页 20 条里有 7 条精确命中猫眼在映榜
#               （欢迎来龙餐馆 / 八仙！/ 敦煌英雄 / 抓特务 / 空枪 / 老江湖 …）
#   "华语"      实测一页 20 条里 4 条命中（年会不能停！2 / 欢迎来龙餐馆 / …）
#   "豆瓣高分"  命中老片（肖申克的救赎 / 机器人总动员 —— 后者正在重映有票房）
# 只抓题材标签的话，库里全是老片，猫眼那 10 列会 100% 空着。
#
# 结论：**max_start 必须开得足够大**。国漫番剧排在「国产动画」的深处，
# 只翻前几页的话会把剧集整个漏掉，那就违背需求了。
tags           = ["动画", "日本动画", "国产动画", "中国动画", "国漫", "欧美动画",
                  "中国大陆", "华语", "豆瓣高分"]
# 每个标签最多翻到 start = 多少。20 条/页
# 8000 约等于 400 页。实测「动画」start=5000 仍有数据，
# 「国产动画」到 2000 还有、4000 空。翻到底会自动提前收工
max_start      = 8000
# 翻页时连续多少个位置确认为空，就认为翻到底了，提前收工。
# 配合下面的递增重试，这表示「连续两个位置、合计约 2 分钟都拿不到数据」。
empty_pages_stop = 2
# 【别关】遇到空页先等这么多秒，重试还空就翻倍再等（上限 empty_recheck_max）。
# 原因：豆瓣限流时返回的是「HTTP 200 + 空数据」，和真的翻到底长得完全一样。
# 实测：连翻 10 页之后，下一个标签的首页会整段变空，几十秒到一分半才恢复。
# 不这样重试的话，限流打嗝会被误判成「翻到底」，静悄悄地少抓一大截。
# 另外 start=0 的首页永远不可能为空，所以那里会自动放宽重试次数（见 douban.py）。
# 设为 0 可关闭重试（不建议）
empty_recheck_wait = 20.0
empty_recheck_max  = 90.0
# 同一个位置最多重试几次（首页另有更宽的次数）
empty_retries  = 2
# 换标签前先歇这么多秒。限流是按 IP 总量算的，换个 tag 不会清零，
# 实测「中国大陆」跑完立刻抓「华语」，对方响应直接全变空页。
tag_cooldown   = 15.0
# 是否抓详情
fetch_detail   = true
# 详情只抓没抓过的（增量）。想全量重抓就改成 false
detail_only_new = true

# ---------------------------------------------------------------------------
#  猫眼（辅助数据源：只做「在映 + 票房」时序）
#  已验证：列表页 HTML 可直接解析；详情页是 JS 骨架 + 字体反爬，必须浏览器
# ---------------------------------------------------------------------------
[maoyan]
enabled        = true

# 【怎么拿到真票房】不要从 www.maoyan.com/films 的 HTML 里抠数字 ——
# 那里只有片单，数字要么没有、要么被「石头字体」换成 PUA 码位（预售票房就这么混淆的）；
# /films/{id} 详情页更是纯 JS 骨架，requests 抓到的 HTML 里连片名都没有。
# 真票房在专业版接口，免费、无签名、无需登录：
#     GET https://piaofang.maoyan.com/dashboard-ajax/movie
# 不传参数就返回 70+ 部在映影片 + 当日大盘。
board          = true

# 单片类型（category，如 "神话,喜剧,冒险,动画"）+ 近 5 日逐日票房。
# 榜单本身不给类型，所以判断「是不是动画片」也靠这一步。
# 代价：每部一次请求、约 2 秒，是猫眼这边唯一的耗时大头。
box_trends     = true
# 只抓榜单前 N 部（0 = 全部约 73 部，2~3 分钟）。想快点跑就设成 20
box_trends_limit = 0

# 片单页 showType：
#   1 = 正在热映（可购票）
#   2 = 即将上映 / 预售   ← 注意别搞反，早期只抓 2 等于把正在上映的全漏了
# 票房榜只覆盖「已上映且当天有排片」的片子，待映片只能从片单页拿
list_show_types = [1, 2]

# 【已废弃】早期打算用浏览器（DrissionPage）渲染详情页 + 解石头字体来补票房。
# 找到 piaofang 接口后这条路线不再需要，配置项也删了。
# stonefont.py 仍保留，只有当你想抠「预售票房」时才用得上。

# ---------------------------------------------------------------------------
#  存储与导出
# ---------------------------------------------------------------------------
[storage]
db_path        = "data/anime.db"
export_dir     = "exports"
# fetch_log 表只保留最近 N 条请求日志（0 = 不限制）
fetch_log_keep = 20000

# ---------------------------------------------------------------------------
#  导出开关
# ---------------------------------------------------------------------------
[export]
csv            = true
parquet        = true
json           = false
# Tableau 宽表（一次成型，直接拖进 Tableau）
tableau_wide   = true
# .hyper 直出（需要 tableauhyperapi，没装会自动跳过）
hyper          = false
